{% extends 'base.html' %}
{% block title %}התחברות - מועדון S.P.C{% endblock %}

{% block content %}
<div class="auth-container" style="flex-direction:column; gap:1.5rem;">
    <div class="auth-logo" style="text-align:center;">
        <img src="{{ url_for('static', filename='img/spc_logo.png') }}"
             alt="S.P.C - Social Poker Club"
             style="max-width:170px; width:100%; height:auto; border-radius:12px;">
    </div>
    <div class="auth-card">
        <h1 class="auth-title" style="font-size:1.35rem; line-height:1.45;">ברוכים הבאים לדף ניהול מועדון S.P.C</h1>
        <h2 class="auth-subtitle">התחברות</h2>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="form-group">
                <label for="email">שם משתמש או אימייל</label>
                <input type="text" id="email" name="email" required placeholder="שם משתמש">
            </div>
            <div class="form-group">
                <label for="password">סיסמה</label>
                <input type="password" id="password" name="password" required placeholder="••••••">
            </div>
            <div class="form-group form-check">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">זכור אותי</label>
            </div>
            <button type="submit" class="btn btn-primary btn-full">התחבר</button>
        </form>

    </div>
</div>
{% endblock %}
